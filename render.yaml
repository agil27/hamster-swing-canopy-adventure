services:
  - type: web
    name: hamswing
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/hamswing.db
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: hamswing-data
      mountPath: /var/data
      sizeGB: 1
