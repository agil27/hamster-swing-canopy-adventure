services:
  - type: web
    name: hamswing
    runtime: node
    plan: free
    # --include=dev is required: NODE_ENV=production below (correct for the
    # running server — see server/auth.js's cookie `secure` flag) also
    # makes a plain `npm install` skip devDependencies, but the build
    # itself needs vite/typescript/@types/* to run at all.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Free Turso database — see server/db.js. Without these, the server
      # falls back to a local SQLite file on Render's own ephemeral disk,
      # which resets on every deploy/spin-down. Get both from
      # https://turso.tech (free tier, no card): `turso db create hamswing`
      # then `turso db show hamswing --url` and `turso db tokens create hamswing`.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
